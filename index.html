
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="eBay Sync">
    <meta name="theme-color" content="#0066cc">
    <title>NGLH eBay Sync</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --primary: #0066cc; --primary-dark: #0052a3; --success: #059669;
            --success-light: #ecfdf5; --danger: #dc2626; --danger-light: #fef2f2;
            --bg: #f8fafc; --surface: #ffffff; --border: #e2e8f0;
            --text: #1e293b; --text-secondary: #64748b; --text-muted: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg); color: var(--text); padding: 16px;
        }
        .container { max-width: 560px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 24px; }
        .logo {
            width: 56px; height: 56px; margin: 0 auto 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 16px; display: flex; align-items: center; justify-content: center;
            font-size: 28px; box-shadow: 0 6px 14px rgba(0,102,204,0.2);
        }
        h1 { font-size: 24px; font-weight: 700; }
        .subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
        .card {
            background: var(--surface); border-radius: 14px; padding: 18px;
            margin-bottom: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); border: 1px solid var(--border);
        }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
        input[type="file"], input[type="text"] {
            width: 100%; padding: 10px; border: 1px solid var(--border);
            border-radius: 8px; font-size: 14px; margin-bottom: 8px;
        }
        .hint { font-size: 11px; color: var(--text-muted); }
        button {
            width: 100%; padding: 13px; font-size: 15px; font-weight: 600;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white; border: none; border-radius: 10px; cursor: pointer;
        }
        button:disabled { background: var(--text-muted); }
        button.secondary { background: var(--surface); color: var(--primary); border: 1px solid var(--primary); }
        .status { margin-top: 10px; padding: 10px; border-radius: 8px; font-size: 12px; display: none; }
        .status.show { display: block; }
        .status.success { background: var(--success-light); color: var(--success); }
        .status.error { background: var(--danger-light); color: var(--danger); }
        table { width: 100%; font-size: 12px; border-collapse: collapse; margin: 10px 0; }
        th { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--border); color: var(--text-secondary); font-size: 11px; text-transform: uppercase; }
        td { padding: 8px 4px; border-bottom: 1px solid var(--border); }
        .change-pos { color: var(--success); font-weight: 600; }
        .change-neg { color: var(--danger); font-weight: 600; }
        .change-zero { color: var(--text-muted); }
        .row-status { font-size: 10px; padding: 2px 6px; border-radius: 4px; }
        .row-status.pending { background: #fef3c7; color: #92400e; }
        .row-status.done { background: var(--success-light); color: var(--success); }
        .row-status.failed { background: var(--danger-light); color: var(--danger); }
        .hidden { display: none !important; }
        .summary-count { font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">⚡</div>
            <h1>NGLH eBay Sync</h1>
            <p class="subtitle">Sandbox testing - full inventory sync</p>
        </header>

        <div class="card">
            <label>Sandbox OAuth Token</label>
            <input type="text" id="authToken" placeholder="Paste your Sandbox token here">
            <div class="hint">Stays in your browser only, never saved anywhere.</div>
        </div>

        <div class="card">
            <label>Upload Rv Companion XLSX</label>
            <input type="file" id="fileInput" accept=".xlsx,.xls">
            <div id="uploadStatus" class="status"></div>
        </div>

        <div id="analysisCard" class="card hidden">
            <label>Games Ready to Sync</label>
            <div class="summary-count" id="summaryCount"></div>
            <table>
                <thead><tr><th>Game</th><th>Rv Qty</th><th>Status</th></tr></thead>
                <tbody id="analysisTable"></tbody>
            </table>
            <button id="syncAllBtn">Sync All to eBay (Sandbox)</button>
            <div id="syncStatus" class="status"></div>
        </div>
    </div>

    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        const appId = "NathanCo-eBayQuan-SBX-c013d68a0-28c33685";
        const devId = "590eb9e5-bedb-4ccf-84c3-23739e389f3d";
        const certId = "SBX-013d68a02898-52fb-4d89-97c4-16b9";

        const titleMapping = {
          'Animal Crossing': '128032384253',
          'Animal Crossing Cartridge': '127954148871',
          'Luigis Mansion 3': '128032385043',
          'Mario Kart 8': '128032381763',
          'Mario Kart 8 Cartridge': '128032384109',
          'Pokemon Arceus': '127907257328',
          'Pokemon Arceus Cartridge': '127916388908',
          'Princess Peach Showtime': '127935957482',
          'Princess Peach Showtime Cartridge': '127992249046',
          'Super Mario 3D Allstars': '127951567807',
          'Super Mario 3D Allstars Cartridge': '128013972085',
          'Super Mario U Deluxe': '127907346508',
          'Super Mario Wonder': '127940340265',
          'Super Mario Wonder Cartridge': '128017583742',
          'Super Mario Odyssey': '127916232402',
          'Super Mario Odyssey Cartridge': '128032561397',
          'Super Mario Jamboree': '127992258497',
          'Super Smash Bros': '127923383109',
          'Super Smash Bros Cartridge': '127916387430',
          'Zelda Links Awakening': '127967561009',
          'Zelda Links Awakening Cartridge': '127927213642',
          'Zelda Breath of the wild': '127925580095',
          'Zelda Breath of the wild Cartridge': '128013967400',
          'Zelda Tears of the kingdom': '128017580568',
          'Mario and Sonic Olympic Games': '128031128860'
        };

        let currentSyncData = {};

        document.getElementById('fileInput').addEventListener('change', handleFileUpload);

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const statusEl = document.getElementById('uploadStatus');
            statusEl.className = 'status show';
            statusEl.textContent = 'Reading file...';

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const data = new Uint8Array(event.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const worksheet = workbook.Sheets['Inventory'];
                    if (!worksheet) throw new Error('Inventory sheet not found');

                    const rows = XLSX.utils.sheet_to_json(worksheet);
                    const listedItems = rows.filter(row => row.status === 'listed');
                    if (listedItems.length === 0) throw new Error('No items with status "listed" found');

                    const titleCounts = {};
                    listedItems.forEach(item => {
                        const name = item.item_name;
                        if (name) titleCounts[name] = (titleCounts[name] || 0) + 1;
                    });

                    const syncData = {};
                    Object.entries(titleMapping).forEach(([title, itemId]) => {
                        if (titleCounts[title]) {
                            syncData[itemId] = { name: title, quantity: titleCounts[title] };
                        }
                    });

                    if (Object.keys(syncData).length === 0) {
                        throw new Error('No matching games found in your inventory');
                    }

                    currentSyncData = syncData;
                    displayAnalysis(syncData);
                    statusEl.className = 'status show success';
                    statusEl.textContent = `Loaded ${listedItems.length} listed items successfully`;
                } catch (err) {
                    statusEl.className = 'status show error';
                    statusEl.textContent = `Error: ${err.message}`;
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function displayAnalysis(data) {
            document.getElementById('summaryCount').textContent = `${Object.keys(data).length} games ready to sync`;
            const tbody = document.getElementById('analysisTable');
            tbody.innerHTML = '';
            Object.entries(data).forEach(([itemId, info]) => {
                const row = document.createElement('tr');
                row.id = `row-${itemId}`;
                row.innerHTML = `
                    <td>${info.name}</td>
                    <td>${info.quantity}</td>
                    <td><span class="row-status pending" id="status-${itemId}">Pending</span></td>
                `;
                tbody.appendChild(row);
            });
            document.getElementById('analysisCard').classList.remove('hidden');
        }

        document.getElementById('syncAllBtn').addEventListener('click', async () => {
            const authToken = document.getElementById('authToken').value.trim();
            const syncStatusEl = document.getElementById('syncStatus');
            const btn = document.getElementById('syncAllBtn');

            if (!authToken) {
                syncStatusEl.className = 'status show error';
                syncStatusEl.textContent = 'Please paste your Sandbox token first';
                return;
            }

            btn.disabled = true;
            const entries = Object.entries(currentSyncData);
            let successCount = 0;
            let failCount = 0;

            for (const [itemId, info] of entries) {
                btn.textContent = `Syncing ${successCount + failCount + 1}/${entries.length}...`;
                const statusBadge = document.getElementById(`status-${itemId}`);

                try {
                    const response = await fetch('/api/ebay-sync', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ itemId, quantity: info.quantity, authToken, appId, devId, certId })
                    });
                    const result = await response.json();
                    const isSuccess = result.success && result.response.includes('<Ack>Success</Ack>');

                    if (isSuccess) {
                        statusBadge.className = 'row-status done';
                        statusBadge.textContent = 'Synced';
                        successCount++;
                    } else {
                        statusBadge.className = 'row-status failed';
                        statusBadge.textContent = 'Failed';
                        failCount++;
                    }
                } catch (err) {
                    statusBadge.className = 'row-status failed';
                    statusBadge.textContent = 'Error';
                    failCount++;
                }
            }

            btn.disabled = false;
            btn.textContent = 'Sync All to eBay (Sandbox)';
            syncStatusEl.className = `status show ${failCount === 0 ? 'success' : 'error'}`;
            syncStatusEl.textContent = `Complete: ${successCount} synced, ${failCount} failed`;
        });
    </script>
</body>
</html>
